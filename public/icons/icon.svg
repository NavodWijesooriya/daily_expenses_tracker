<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="100%" stop-color="#0F0F0F" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE77" />
      <stop offset="100%" stop-color="#FF9248" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#333333" stroke-width="4" />

  <!-- Orange wallet and ledger -->
  <g transform="translate(106, 126)">
    <rect x="0" y="30" width="300" height="200" rx="36" fill="url(#walletGrad)" stroke="#FFAE77" stroke-width="4" />
    
    <path d="M 0 66 C 0 46, 16 30, 36 30 L 264 30 C 284 30, 300 46, 300 66 L 300 100 C 270 120, 240 125, 150 125 C 60 125, 30 120, 0 100 Z" fill="#242424" stroke="#333333" stroke-width="2" />

    <!-- Orange coin with dark currency mark -->
    <g transform="translate(150, 0)" filter="url(#glow)">
      <circle cx="0" cy="0" r="44" fill="#FF9248" stroke="#FFAE77" stroke-width="4" />
      <path d="M -16 -12 L 16 -12 M -16 0 L 12 0 M -8 -12 L -8 18 M 0 0 C 8 2, 14 8, 14 16 L 16 18 M 2 6 L 16 20" stroke="#0F0F0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <rect x="220" y="110" width="80" height="48" rx="24" fill="#0F0F0F" stroke="#333333" stroke-width="3" />
    <circle cx="270" cy="134" r="8" fill="#FF9248" />

    <path d="M 40 180 Q 90 150 130 170 T 210 145" fill="none" stroke="#FF9248" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
